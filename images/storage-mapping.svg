<rect width='1200' height='390' fill='#f5f9fd'/><text x='600.0' y='44' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='26' font-weight='bold' fill='#0b3d91'>Storage Mapping</text><text x='600.0' y='70' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='14' fill='#5d6d7e'>How a container path ends up on the dedicated HDD</text><rect x='40' y='100' width='260' height='120' rx='14' fill='#e8f3fb' stroke='#1f6fa8' stroke-width='2'/><text x='170.0' y='128' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Inside container</text><text x='170.0' y='152' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>nextcloud-app</text><text x='170.0' y='172' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>/var/www/html/data</text><text x='170.0' y='192' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>(what Nextcloud sees)</text><rect x='370' y='100' width='260' height='120' rx='14' fill='#f0ecfb' stroke='#7d5fc0' stroke-width='2'/><text x='500.0' y='128' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Docker bind mount</text><text x='500.0' y='152' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>/mnt/storage/nextcloud/data:</text><text x='500.0' y='172' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>/var/www/html/data</text><text x='500.0' y='192' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>(compose.yaml)</text><rect x='700' y='100' width='220' height='120' rx='14' fill='#fff6df' stroke='#e0a800' stroke-width