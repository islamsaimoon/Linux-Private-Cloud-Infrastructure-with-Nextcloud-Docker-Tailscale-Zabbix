<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='320' viewBox='0 0 1200 320'>
<defs><marker id='ar' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1f6fa8'/></marker>
<marker id='arr' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#c0392b'/></marker>
<linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#0b3d91'/><stop offset='1' stop-color='#1ea7ff'/></linearGradient></defs>
<rect width='1200' height='320' fill='#f5f9fd'/><text x='600.0' y='44' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='26' font-weight='bold' fill='#0b3d91'>What happens when a file is uploaded?</text><text x='600.0' y='70' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='14' fill='#5d6d7e'>From your browser to the physical disk</text><rect x='40' y='120' width='190' height='100' rx='14' fill='#e8f3fb' stroke='#1f6fa8' stroke-width='2'/><text x='135.0' y='148' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>User</text><text x='135.0' y='172' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Browser / phone app</text><line x1='230' y1='170' x2='270' y2='170' stroke='#1f6fa8' stroke-width='3' marker-end='url(#ar)'/><text x='135' y='105' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#1f6fa8'>Step 1</text><rect x='270' y='120' width='190' height='100' rx='14' fill='#e8f3fb' stroke='#1f6fa8' stroke-width='2'/><text x='365.0' y='148' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Nextcloud</text><text x='365.0' y='172' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Auth + quota check</text><line x1='460' y1='170' x2='500' y2='170' stroke='#1f6fa8' stroke-width='3' marker-end='url(#ar)'/><text x='365' y='105' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#1f6fa8'>Step 2</text><rect x='500' y='120' width='190' height='100' rx='14' fill='#fff6df' stroke='#1f6fa8' stroke-width='2'/><text x='595.0' y='148' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>MariaDB</text><text x='595.0' y='172' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>File metadata</text><line x1='690' y1='170' x2='730' y2='170' stroke='#1f6fa8' stroke-width='3' marker-end='url(#ar)'/><text x='595' y='105' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#1f6fa8'>Step 3</text><rect x='730' y='120' width='190' height='100' rx='14' fill='#f0ecfb' stroke='#1f6fa8' stroke-width='2'/><text x='825.0' y='148' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Bind mount</text><text x='825.0' y='172' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Container → host path</text><line x1='920' y1='170' x2='960' y2='170' stroke='#1f6fa8' stroke-width='3' marker-end='url(#ar)'/><text x='825' y='105' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#1f6fa8'>Step 4</text><rect x='960' y='120' width='190' height='100' rx='14' fill='#fdecec' stroke='#1f6fa8' stroke-width='2'/><text x='1055.0' y='148' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>HDD /dev/sdb1</text><text x='1055.0' y='172' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Physical file on ext4</text><text x='1055' y='105' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#1f6fa8'>Step 5</text><text x='600' y='275' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='14' fill='#34495e'>Container path /var/www/html/data  ⇒  host path /mnt/storage/nextcloud/data  ⇒  partition /dev/sdb1</text></svg>