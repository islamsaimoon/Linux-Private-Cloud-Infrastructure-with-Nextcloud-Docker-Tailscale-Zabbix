<rect width='1200' height='620' fill='#f5f9fd'/><text x='600.0' y='44' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='26' font-weight='bold' fill='#0b3d91'>Final Architecture</text><text x='600.0' y='70' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='14' fill='#5d6d7e'>One Linux server · existing Zabbix untouched · isolated Nextcloud stack · dedicated HDD · private remote access</text><rect x='60' y='110' width='260' height='110' rx='14' fill='#e8f3fb' stroke='#1f6fa8' stroke-width='2'/><text x='190.0' y='138' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Remote clients</text><text x='190.0' y='162' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Phone / home PC</text><text x='190.0' y='182' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Tailscale installed</text><rect x='470' y='100' width='260' height='130' rx='14' fill='#eaf7ee' stroke='#27ae60' stroke-width='2'/><text x='600.0' y='128' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Physical Linux server</text><text x='600.0' y='152' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Zorin OS 18.1</text><text x='600.0' y='172' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Existing Zabbix + Apache</text><text x='600.0' y='192' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Docker Engine</text><rect x='880' y='110' width='260' height='110' rx='14' fill='#f0ecfb' stroke='#7d5fc0' stroke-width='2'/><text x='1010.0' y='138' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Tailscale network</text><text x='1010.0' y='162' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Encrypted WireGuard tunnel</text><text x='1010.0' y='182' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>No router port-forwarding</text><line x1='320' y1='165' x2='470' y2='165' stroke='#1f6fa8' stroke-width='3' marker-end='url(#ar)'/><text x='395.0' y='157.0' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12' fill='#34495e'>encrypted</text><line x1='880' y1='165' x2='730' y2='165' stroke='#1f6fa8' stroke-width='3' marker-end='url(#ar)'/><text x='805.0' y='157.0' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12' fill='#34495e'>private VPN</text><line x1='600' y1='230' x2='240' y2='380' stroke='#1f6fa8' stroke-width='3' marker-end='url(#ar)'/><line x1='600' y1='230' x2='600' y2='380' stroke='#1f6fa8' stroke-width='3' marker-end='url(#ar)'/><text x='642.0' y='297.0' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12' fill='#34495e'>bind mount</text><line x1='600' y1='230' x2='960' y2='380' stroke='#1f6fa8' stroke-width='3' marker-end='url(#ar)'/><rect x='90' y='380' width='300' height='150' rx='14' fill='#fff6df' stroke='#e0a800' stroke-width='2'/><text x='240.0' y='408' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Docker stack</text><text x='240.0' y='432' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>nextcloud-app  :8080 → :80</text><text x='240.0' y='452' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>nextcloud-db  (MariaDB 11.4)</text><text x='240.0' y='472' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>nextcloud-redis  (Redis 7)</text><text x='240.0' y='492' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>internal Compose network</text><rect x='450' y='380' width='300' height='150' rx='14' fill='#fdecec' stroke='#c0392b' stroke-width='2'/><text x='600.0' y='408' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Dedicated storage</text><text x='600.0' y='432' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>/dev/sdb1 · ext4 · ~1 TB HDD</text><text x='600.0' y='452' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>mounted at /mnt/storage</text><text x='600.0' y='472' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>/mnt/storage/nextcloud/data</text><text x='600.0' y='492' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>(user files live here)</text><rect x='810' y='380' width='300' height='150' rx='14' fill='#eaf0f7' stroke='#4a6fa5' stroke-width='2'/><text x='960.0' y='408' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Monitoring</text><text x='960.0' y='432' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Zabbix server :10051</text><text x='960.0' y='452' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Zabbix agent :10050</text><text x='960.0' y='472' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>CPU / RAM / disk today</text><text x='960.0' y='492' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Docker + Nextcloud checks next</text><text x='600' y='580' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#5d6d7e'>Only the Nextcloud web port (8080) is published. MariaDB and Redis stay inside Docker's private network.</text></svg>