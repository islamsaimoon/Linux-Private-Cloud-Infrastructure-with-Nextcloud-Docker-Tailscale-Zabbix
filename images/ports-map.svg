<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='560' viewBox='0 0 1200 560'><rect width='1200' height='560' fill='#f5f9fd'/><text x='600.0' y='42' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='25' font-weight='bold' fill='#0b3d91'>Ports &amp; Services Map</text><text x='600.0' y='66' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13.5' fill='#5d6d7e'>Who listens on what, on the single Linux host</text><rect x='40' y='95' width='1120' height='430' rx='18' fill='#ffffff' stroke='#95a5a6' stroke-width='2' stroke-dasharray='8 5'/><text x='60' y='122' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#5d6d7e'>Host: Zorin OS 18.1 — one network interface, many services</text><rect x='60' y='150' width='150' height='110' rx='14' fill='#eaf0f7' stroke='#1f6fa8' stroke-width='2'/><text x='135.0' y='176' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#0b2e4f'>Port 22</text><text x='135.0' y='198' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>SSH</text><text x='135.0' y='217' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Remote shell login</text><rect x='224' y='150' width='150' height='110' rx='14' fill='#fdecec' stroke='#1f6fa8' stroke-width='2'/><text x='299.0' y='176' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#0b2e4f'>Port 80</text><text x='299.0' y='198' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Apache</text><text x='299.0' y='217' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Existing host web server</text><text x='299.0' y='236' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>(Zabbix UI)</text><rect x='388' y='150' width='150' height='110' rx='14' fill='#fdecec' stroke='#1f6fa8' stroke-width='2'/><text x='463.0' y='176' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#0b2e4f'>Port 3306</text><text x='463.0' y='198' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>MariaDB (host)</text><text x='463.0' y='217' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Zabbix's own database</text><text x='463.0' y='236' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>localhost only</text><rect x='552' y='150' width='150' height='110' rx='14' fill='#eaf0f7' stroke='#1f6fa8' stroke-width='2'/><text x='627.0' y='176' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#0b2e4f'>Port 3389</text><text x='627.0' y='198' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>XRDP</text><text x='627.0' y='217' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Remote desktop</text><rect x='716' y='150' width='150' height='110' rx='14' fill='#fff6df' stroke='#1f6fa8' stroke-width='2'/><text x='791.0' y='176' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#0b2e4f'>Port 8080</text><text x='791.0' y='198' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Nextcloud</text><text x='791.0' y='217' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Published by Docker</text><text x='791.0' y='236' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>(app container)</text><rect x='880' y='150' width='150' height='110' rx='14' fill='#eaf7ee' stroke='#1f6fa8' stroke-width='2'/><text x='955.0' y='176' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#0b2e4f'>Port 10050</text><text x='955.0' y='198' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Zabbix agent</text><text x='955.0' y='217' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Reports this host's</text><text x='955.0' y='236' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>metrics</text><rect x='1044' y='150' width='150' height='110' rx='14' fill='#eaf7ee' stroke='#1f6fa8' stroke-width='2'/><text x='1119.0' y='176' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#0b2e4f'>Port 10051</text><text x='1119.0' y='198' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Zabbix server</text><text x='1119.0' y='217' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Collects data from</text><text x='1119.0' y='236' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>agents</text><text x='600.0' y='330' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#5d6d7e'>MariaDB (host, :3306) and the Nextcloud stack's own db/redis containers are never exposed outside Docker — only 8080 is published.</text><rect x='60' y='360' width='520' height='150' rx='14' fill='#f0ecfb' stroke='#7d5fc0' stroke-width='2'/><text x='320.0' y='386' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#0b2e4f'>Docker's private network (not shown above)</text><text x='320.0' y='408' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>nextcloud-db (MariaDB 11.4) — internal only</text><text x='320.0' y='427' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>nextcloud-redis (Redis 7) — internal only</text><text x='320.0' y='446' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>Reachable by service name (db, redis)</text><text x='320.0' y='465' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>only from inside the nextcloud-app container</text><rect x='620' y='360' width='520' height='150' rx='14' fill='#eaf7ee' stroke='#27ae60' stroke-width='2'/><text x='880.0' y='386' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#0b2e4f'>Reachable from outside the host</text><text x='880.0' y='408' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>8080 → Nextcloud (LAN or Tailscale)</text><text x='880.0' y='427' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>10050/10051 → Zabbix (LAN)</text><text x='880.0' y='446' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>22 / 3389 → admin access (LAN, restrict as needed)</text><text x='880.0' y='465' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='12.5' fill='#34495e'>80 → existing Zabbix web UI (LAN)</text></svg>