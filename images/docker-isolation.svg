<rect width='1200' height='540' fill='#f5f9fd'/><text x='600.0' y='44' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='26' font-weight='bold' fill='#0b3d91'>Why Docker? Isolation on a shared server</text><text x='600.0' y='70' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='14' fill='#5d6d7e'>Host services stay untouched; Nextcloud gets its own app, database and cache</text><rect x='40' y='100' width='1120' height='400' rx='18' fill='#ffffff' stroke='#95a5a6' stroke-width='2' stroke-dasharray='8 5'/><text x='60' y='128' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' font-weight='bold' fill='#5d6d7e'>Host: Zorin OS 18.1 (Linux)</text><rect x='70' y='150' width='300' height='320' rx='14' fill='#eaf0f7' stroke='#4a6fa5' stroke-width='2'/><text x='220.0' y='178' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#0b2e4f'>Existing host services</text><text x='220.0' y='202' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Apache  → port 80</text><text x='220.0' y='222' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>MariaDB (host) → 127.0.0.1:3306</text><text x='220.0' y='242' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Zabbix server → 10051</text><text x='220.0' y='262' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>Zabbix agent → 10050</text><text x='220.0' y='282' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'>SSH → 22   ·   XRDP → 3389</text><text x='220.0' y='302' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='13' fill='#34495e'></text><text x='220.0' y='322' text-