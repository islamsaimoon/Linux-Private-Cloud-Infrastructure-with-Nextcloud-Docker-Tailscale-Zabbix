<rect width='1200' height='470' fill='#f5f9fd'/><text x='600.0' y='44' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='26' font-weight='bold' fill='#0b3d91'>Project Status &amp; Roadmap</text><text x='600.0' y='70' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='14' fill='#5d6d7e'>What is done, and what turns this lab into something production-like</text><rect x='60' y='100' width='520' height='330' rx='16' fill='#eaf7ee' stroke='#27ae60' stroke-width='2'/><text x='320' y='135' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='18' font-weight='bold' fill='#1e8449'>✔ Completed in the lab</text><text x='90' y='180' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#1b4f2e'>✔  Dedicated ext4 HDD mounted by UUID</text><text x='90' y='220' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#1b4f2e'>✔  Docker + Compose installed</text><text x='90' y='260' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#1b4f2e'>✔  Nextcloud + MariaDB + Redis stack</text><text x='90' y='300' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#1b4f2e'>✔  Port 8080 local access</text><text x='90' y='340' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#1b4f2e'>✔  Users + storage quotas tested</text><text x='90' y='380' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#1b4f2e'>✔  Tailscale remote access from phone</text><rect x='620' y='100' width='520' height='330' rx='16' fill='#fff6df' stroke='#e0a800' stroke-width='2'/><text x='880' y='135' text-anchor='middle' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='18' font-weight='bold' fill='#8a6d00'>☐ Next steps</text><text x='650' y='180' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#5a4600'>☐  HTTPS + clean hostname (reverse proxy)</text><text x='650' y='220' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#5a4600'>☐  Automated backups + restore test</text><text x='650' y='260' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#5a4600'>☐  SMART disk-health monitoring</text><text x='650' y='300' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#5a4600'>☐  Zabbix checks for Docker / Nextcloud</text><text x='650' y='340' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#5a4600'>☐  Firewall rules review (LAN/Tailscale)</text><text x='650' y='380' font-family='DejaVu Sans, Arial, Helvetica, sans-serif' font-size='15' fill='#5a4600'>☐  Second disk (RAID1) + UPS</text></svg>